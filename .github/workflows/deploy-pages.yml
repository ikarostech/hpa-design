name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - package.json

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  version_check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      current: ${{ steps.version.outputs.current }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check application version
        id: version
        shell: bash
        run: |
          current=$(node -p "require('./package.json').version")
          before="${{ github.event.before }}"
          if git cat-file -e "$before:package.json" 2>/dev/null; then
            previous=$(git show "$before:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          else
            previous=""
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [[ "$current" == "$previous" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "package.json changed without an application version update; deployment is skipped."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Application version changed from $previous to $current."
          fi

  build:
    if: needs.version_check.outputs.changed == 'true'
    needs: version_check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify project JSON Schema
        run: npm run schema:project-json:check
      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
